<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauntlet Plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:{{c.bg}};color:{{c.ink}};font-family:Figtree,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <header style="padding:12px 16px 8px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:800;font-size:24px">This week</span>
      <button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:38px;height:38px;border-radius:50%;background:{{c.surface}};border:1px solid {{c.line}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
        <sc-if value="{{day}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></sc-if>
        <sc-if value="{{night}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      </button>
    </div>
    <div style="font-size:13px;color:{{c.sub}}">5 to 11 October. HIFB, 4 sessions. 1 of 4 done. Built from Sunday's check in.</div>
  </header>

  <main style="flex:1;overflow:auto;padding:0 12px">
    <section style="background:{{c.surface}};border:1px solid {{c.line}};border-radius:12px;overflow:hidden">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="{{d.rowStyle}}">
          <span style="{{d.dayStyle}}">{{d.dn}}</span>
          <div><b style="font-size:15px">{{d.t}}</b><div style="{{d.subStyle}}">{{d.s}}</div></div>
          <sc-if value="{{d.done}}" hint-placeholder-val="{{false}}"><span style="width:24px;height:24px;border-radius:50%;background:{{c.green}};display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="{{c.ctaInk}}" stroke-width="2.4"><path d="M2 6.5 5 9l5-6"/></svg></span></sc-if>
          <sc-if value="{{d.open}}" hint-placeholder-val="{{true}}"><a href="{{L.plan}}" style="height:32px;padding:0 12px;border-radius:16px;border:1px solid {{c.line}};background:{{c.surface}};display:flex;align-items:center;font-size:12px;font-weight:700">Change</a></sc-if>
        </div>
      </sc-for>
    </section>

    <section style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px">
      <a href="{{L.plan}}" style="padding:12px;border-radius:12px;background:{{c.surface}};border:1px solid {{c.line}}"><b style="display:block;font-size:14px">Templates and runs</b><span style="font-size:12px;color:{{c.mute}}">Search, preview, duplicate</span></a>
      <a href="{{L.plan}}" style="padding:12px;border-radius:12px;background:{{c.surface}};border:1px solid {{c.line}}"><b style="display:block;font-size:14px">Training style</b><span style="font-size:12px;color:{{c.mute}}">HIFB and gym, your kit</span></a>
    </section>
  </main>

  <nav aria-label="Sections" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:62px;border-top:1px solid {{c.line}};background:{{c.navBg}};font-size:10px;font-weight:700;text-align:center">
    <a href="{{L.today}}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{c.mute}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>Today</a>
    <a href="{{L.plan}}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{c.greenText}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</a>
    <a href="{{L.log}}" aria-label="Log something" style="display:flex;align-items:center;justify-content:center"><span style="width:46px;height:46px;border-radius:50%;background:{{c.logBg}};color:{{c.logInk}};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></span></a>
    <a href="{{L.eat}}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{c.mute}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Eat</a>
    <a href="{{L.you}}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{c.mute}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["day","night"],"default":"day"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var th = (this.state && this.state.theme) || this.props.theme || 'day';
    var n = th === 'night';
    var P = {
      day: { bg:'#F6F5F1', surface:'#FFFFFF', line:'#E6E4DE', ink:'#1B1F1D', mute:'#6A706C', sub:'#3D4440', track:'#EDEBE5', chip:'#EDEBE5',
        green:'#17844F', greenText:'#17844F', greenTint:'#E3F2EA', cta:'#17844F', ctaInk:'#FFFFFF',
        coral:'#E0613B', coralText:'#B8452A', coralTint:'#FBE9E3', amber:'#D88A1C', amberText:'#9A5C0A', amberTint:'#F8EEDC',
        navBg:'#FFFFFF', logBg:'#1B1F1D', logInk:'#FFFFFF' },
      night: { bg:'#0F1211', surface:'#181C1A', line:'#262B29', ink:'#F2F3F1', mute:'#8F9692', sub:'#C6CBC8', track:'#232826', chip:'#232826',
        green:'#3DD68C', greenText:'#3DD68C', greenTint:'#18291F', cta:'#3DD68C', ctaInk:'#06120B',
        coral:'#FF7A59', coralText:'#FF8F72', coralTint:'#33221D', amber:'#FFB23E', amberText:'#FFB23E', amberTint:'#322819',
        navBg:'#0F1211', logBg:'#F2F3F1', logInk:'#0F1211' }
    };
    var c = n ? P.night : P.day;
    var pre = n ? 'Night-' : 'Final-';
    var L = { today: n ? 'Night-Today.dc.html' : 'Main.dc.html', low: pre + 'Low.dc.html', log: pre + 'Log.dc.html', plan: pre + 'Plan.dc.html',
      eat: pre + 'Eat.dc.html', train: pre + 'Train.dc.html', you: pre + 'You.dc.html' };
    var raw = [
      { dn:'Mon', t:'HIFB Back and Biceps', s:'Done, 58 min, 400s avg 1:41', done:true },
      { dn:'Tue', t:'HIFB Chest and Triceps', s:'Today, 18:30. Incline press up to 32.5 kg, earned last week', today:true },
      { dn:'Wed', t:'Rest', s:'Nothing owed. Rest is part of it.' },
      { dn:'Thu', t:'HIFB Legs', s:'Leaving out jump lunges while the knee settles', flag:true },
      { dn:'Fri', t:'Walk', s:'10,000 steps, counted for you' },
      { dn:'Sat', t:'HIFB Shoulders and Abs', s:'One set lighter than usual this week' },
      { dn:'Sun', t:'Rest and weekly check in', s:'Two minutes; next week is built from it' }
    ];
    var days = raw.map(function (d, i) {
      return { dn:d.dn, t:d.t, s:d.s, done:!!d.done, open:!d.done,
        rowStyle: 'display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px 14px;' + (i ? 'border-top:1px solid ' + c.line + ';' : '') + (d.today ? 'background:' + c.amberTint + ';' : ''),
        dayStyle: 'font-size:13px;font-weight:800;color:' + (d.today ? c.amberText : c.mute),
        subStyle: 'font-size:12px;color:' + (d.flag ? c.amberText : c.mute) + (d.flag ? ';font-weight:600' : '') };
    });
    return { c: c, L: L, days: days, night: n, day: !n,
      toggleLabel: n ? 'Switch to day' : 'Switch to night',
      toggle: function () { self.setState({ theme: n ? 'day' : 'night' }); } };
  }
}
</script>
</body>
</html>
